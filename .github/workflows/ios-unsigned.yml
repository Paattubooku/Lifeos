# Builds an unsigned Life.ipa on GitHub's free macOS runners, for installing
# with SideStore and a free Apple ID (docs/IOS-STANDALONE.md).
# Run it from the Actions tab (when this file is on the default branch) or by
# pushing a tag that starts with "ios-" (works from any branch).
name: iOS unsigned IPA (SideStore)

on:
  workflow_dispatch:
  push:
    tags: ['ios-*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Public Supabase settings (.env)
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the repository secrets EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: App settings for a sideloaded build
        run: node scripts/ios-sideload-config.mjs

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean
        env:
          CI: '1'

      - name: Remove capabilities a free Apple ID can't sign
        # Push notifications (aps-environment): Life only schedules local
        # reminders on the phone, which need no entitlement.
        run: |
          for f in ios/*/*.entitlements; do
            /usr/libexec/PlistBuddy -c 'Delete :aps-environment' "$f" 2>/dev/null || true
            cat "$f"
          done

      - name: Build (Release, unsigned)
        run: |
          xcodebuild \
            -workspace ios/Life.xcworkspace \
            -scheme Life \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package Life.ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "::error::No .app was built"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Life.ipa Payload
          ls -lh Life.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Life-ipa
          path: Life.ipa
          retention-days: 14
