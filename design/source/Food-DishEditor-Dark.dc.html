.lo-sheet{animation:loSheet .6s cubic-bezier(.34,1.3,.64,1) both .1s}
@keyframes loFade{from{opacity:0}to{opacity:1}}

@keyframes loShake{0%,100%{transform:none}25%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-4deg)}}
.lo-banner-ic{animation:loShake .7s ease both .7s}
@keyframes loFlame{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.lo-flame{transform-origin:50% 90%;animation:loFlame 1.6s ease-in-out infinite}
@keyframes loGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lo-barv{transform-box:fill-box;transform-origin:50% 100%;animation:loGrow .9s cubic-bezier(.34,1.3,.64,1) both}
@keyframes loDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.lo-line{stroke-dasharray:1;animation:loDraw 1.6s cubic-bezier(.4,0,.2,1) both .2s}
@keyframes loSnack{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.lo-snack{animation:loSnack .5s cubic-bezier(.34,1.3,.64,1) both}
.lo-ringlive{transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
@keyframes loIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.lo-in{animation:loIn .45s cubic-bezier(.34,1.3,.64,1) both}
@keyframes loTab{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.lo-tabpill{animation:loTab .5s cubic-bezier(.34,1.3,.64,1) both .4s}
.lo-shine{}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
